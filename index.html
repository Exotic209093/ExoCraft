<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExoCraft</title>
  </head>
  <body>
    <div id="app">
      <div id="menu">
        <h1>ExoCraft</h1>
        <p>Browser voxel sandbox</p>
        <p class="menu-line">Move: WASD or Arrows</p>
        <p class="menu-line">Jump: Space</p>
        <p class="menu-line">Break: Left Click</p>
        <p class="menu-line">Place: Right Click</p>
        <p class="menu-line">Look: Middle click to lock/unlock cursor</p>
        <p class="menu-line">Select block: 1-5</p>
        <p class="menu-line">Fullscreen: F</p>
        <button id="start-btn" type="button">Start</button>
      </div>

      <div id="hud" class="hidden">
        <div id="crosshair"></div>
        <div id="stats"></div>
        <div id="hotbar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
